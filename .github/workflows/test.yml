name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x http2audit.sh tests/mocks/* tests/run_all.sh tests/*_test.sh

      - name: Run tests
        run: bash tests/run_all.sh
